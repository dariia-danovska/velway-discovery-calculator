<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velway · AI Discovery Pricing Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F5; --panel:#FFFFFF; --ink:#12302F; --ink-2:#4A6362; --line:#D5E0DE;
  --teal:#0F4C4C; --teal-2:#186767; --teal-soft:#E1EEEC; --mint:#CFEAE3;
  --amber:#B9791E; --amber-soft:#FBF1DE; --red:#A63D2F; --red-soft:#F9E5E1;
  --input:#FFFFFF; --input-line:#B7C9C6; --focus:#2A9D8F;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1C1B; --panel:#152927; --ink:#E6F0EE; --ink-2:#9DB5B2; --line:#264240;
    --teal:#7FD1C4; --teal-2:#5FB8AB; --teal-soft:#1B3634; --mint:#1F4642;
    --amber:#E4B15E; --amber-soft:#3A2E16; --red:#F08B7C; --red-soft:#3D1F1A;
    --input:#0F2120; --input-line:#3A5A57; --focus:#7FD1C4;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1C1B; --panel:#152927; --ink:#E6F0EE; --ink-2:#9DB5B2; --line:#264240;
  --teal:#7FD1C4; --teal-2:#5FB8AB; --teal-soft:#1B3634; --mint:#1F4642;
  --amber:#E4B15E; --amber-soft:#3A2E16; --red:#F08B7C; --red-soft:#3D1F1A;
  --input:#0F2120; --input-line:#3A5A57; --focus:#7FD1C4;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--teal);color:#EAF4F2;padding:22px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
:root[data-theme="dark"] .side, .side{color:#EAF4F2}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .side{background:#0B2524} }
:root[data-theme="dark"] .side{background:#0B2524}
.brand{font-weight:600;font-size:17px;letter-spacing:.01em}
.brand small{display:block;font-weight:400;opacity:.75;font-size:12px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{background:transparent;border:0;text-align:left;padding:9px 10px;border-radius:6px;color:inherit;opacity:.8;cursor:pointer}
.nav button:hover{opacity:1;background:rgba(255,255,255,.08)}
.nav button.on{opacity:1;background:rgba(255,255,255,.14);font-weight:600}
.side .foot{margin-top:auto;font-size:12px;opacity:.75;line-height:1.5}
.modebox{background:rgba(255,255,255,.1);border-radius:8px;padding:10px}
.modebox label{display:block;font-size:12px;opacity:.8;margin-bottom:6px}
.seg{display:flex;background:rgba(0,0,0,.2);border-radius:6px;padding:2px}
.seg button{flex:1;border:0;background:transparent;color:inherit;padding:6px;border-radius:5px;cursor:pointer;font-size:13px;opacity:.75}
.seg button.on{background:rgba(255,255,255,.9);color:var(--teal);opacity:1;font-weight:600}
:root[data-theme="dark"] .seg button.on{color:#0B2524}
.main{padding:26px 34px 80px;max-width:1180px}
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:24px;font-weight:600;margin:0}
h2{font-size:16px;font-weight:600;margin:26px 0 10px}
h2:first-child{margin-top:0}
.sub{color:var(--ink-2);margin:4px 0 0}
.page{display:none}.page.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px 22px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-2)}
input[type=text],input[type=number],input[type=date],select,textarea{
  background:var(--input);border:1px solid var(--input-line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:transparent}
input[type=number]{font-family:var(--mono);font-size:14px}
textarea{min-height:120px;font-family:var(--mono);font-size:13px;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--ink-2);font-weight:500;font-size:13px}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:13.5px}
td input[type=number]{padding:4px 6px;width:88px;text-align:right}
td input[type=text]{padding:4px 6px}
.tbl-wrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--teal-soft);color:var(--teal)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.note{background:var(--amber-soft);border-left:3px solid var(--amber);padding:10px 12px;border-radius:6px;font-size:14px;margin:10px 0}
.note.bad{background:var(--red-soft);border-color:var(--red)}
.note.ok{background:var(--teal-soft);border-color:var(--teal)}
.btn{background:var(--teal);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500}
:root[data-theme="dark"] .btn{color:#0B2524}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn{color:#0B2524} }
.btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pkgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pkg{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--panel);cursor:pointer;position:relative}
.pkg.on{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.pkg .name{font-weight:600}
.pkg .price{font-family:var(--mono);font-size:22px;margin:6px 0 2px}
.pkg .meta{color:var(--ink-2);font-size:13px}
.pkg .cost{font-size:12px;color:var(--ink-2);font-family:var(--mono);margin-top:6px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.bigprice{font-family:var(--mono);font-size:40px;line-height:1;margin:6px 0 2px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-size:14px}
.kv .n{font-family:var(--mono);text-align:right}
.kv .tot{font-weight:600;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.bar{height:10px;background:var(--teal-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.bar i.over{background:var(--red)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.chk input{margin-top:4px}
.chk .lvl{font-size:12px;min-width:60px;color:var(--ink-2)}
.chk .what{font-size:13px;color:var(--ink-2)}
.summary-bar{position:fixed;bottom:0;left:230px;right:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 34px;display:flex;gap:26px;align-items:center;font-size:14px;z-index:5}
.summary-bar b{font-family:var(--mono);font-size:18px}
.summary-bar .dim{color:var(--ink-2)}
.internal-only{}
body.partner .internal-only{display:none!important}
.sm{font-size:13px;color:var(--ink-2)}
.tabs{display:none;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--teal);color:#EAF4F2}
.tabs button{flex:0 0 auto;background:transparent;border:0;color:inherit;padding:8px 10px;border-radius:6px;opacity:.8;white-space:nowrap}
.tabs button.on{background:rgba(255,255,255,.16);opacity:1;font-weight:600}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .tabs{display:flex;position:sticky;top:0;z-index:6}
  .main{padding:18px 16px 90px}
  .summary-bar{left:0;padding:10px 16px;gap:14px;flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="tabs" id="tabs"></div>
<div class="app">
  <aside class="side">
    <div class="brand">Velway<small>AI Discovery · pricing calculator</small></div>

    </div>
    <div class="modebox">

        <button data-l="en">EN</button>
      </div>
    </div>
    <div class="foot" id="foot"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="summary-bar" id="sumbar"></div>

function deepMerge(a,b){ if(Array.isArray(b)) return b; if(b&&typeof b==="object"&&a&&typeof a==="object"){const o=Object.assign({},a); for(const k in b) o[k]=deepMerge(a[k],b[k]); return o;} return b===undefined?a:b; }

/* ===================== model ===================== */
const lk=(arr,k,f)=>{const x=arr.find(o=>o.k===k); return x?x[f]:undefined;};
function zero(){return {ba:0,pm:0,tl:0,arch:0};}
function addH(dst,src,f=1){for(const r of ROLES) dst[r]+= (src[r]||0)*f; return dst;}
function calcPkg(pkg,inp,S){
 const lines=[]; const H=zero();
 const push=(id,h)=>{lines.push({id,h}); addH(H,h);};
 const fx=S.fixed[pkg]||{};
 if(pkg==="workshop"){
  push("prep",fx.prep); const fac=zero(); addH(fac,S.facilDay,Math.max(1,inp.wdays||1)); push("facil",fac); push("present",fx.present);
 } else {
  push("prep",fx.prep); push("kickoff",fx.kickoff);
  const nUnits = pkg==="express"?1:(inp.unit==="dept"?inp.nDept:inp.nWf);
  const f = (pkg!=="express"&&inp.unit==="wf")?S.wfFactor:1;
  const per={ba:S.norm.session+S.norm.analysis+S.norm.ba,pm:S.norm.pm,tl:S.norm.tl,arch:S.norm.arch};
  const ar=zero(); addH(ar,per,nUnits*f); push("areas",ar);
  if(inp.interviews>0){const iv=zero(); addH(iv,S.interview,inp.interviews); push("interviews",iv);}
  const extraUC=Math.max(0,(inp.usecases||0)-(S.ucBase[pkg]||0)); if(extraUC>0&&pkg!=="express"){const u=zero(); addH(u,S.usecase,extraUC); push("usecases",u);}
  push("prio",fx.prio);
  const rf=S.roadmapF[inp.roadmap]||1; const rm=zero(); addH(rm,fx.roadmap,pkg==="express"?1:rf); push("roadmap",rm);
  if(fx.kpi) push("kpi",fx.kpi);
  push("doc",fx.doc); push("present",fx.present);
 }
 // add-ons
 const addons=[]; let addFixed=0;
 for(const a of S.addons){
  const included=a.incl.includes(pkg); const chosen=!!inp.addons[a.id];
  if(included||chosen){
   if(a.fixed>0&&!included){addFixed+=a.fixed; addons.push({a,fixed:a.fixed,included});}
   else {const h=zero(); addH(h,a.h); addH(H,h); addons.push({a,h,included});}
  }
 }
 const buf=1+S.buffer/100;
 const cost=ROLES.reduce((s,r)=>s+H[r]*S.rates[r],0)*buf;
 const mult={country:lk(S.country,inp.country,"m")||1,vertical:lk(S.vertical,inp.vertical,"m")||1,size:lk(S.size,inp.size,"m")||1,urgency:lk(S.urgency,inp.urgency,"m")||1,maturity:lk(S.maturity,inp.maturity,"m")||1};
 const M=Object.values(mult).reduce((a,b)=>a*b,1);
 const margin=(S.margin[pkg]||0)/100;
 const raw=cost*M/(1-margin);
 const minP=S.minPrice[pkg]||0;
 const price=Math.max(raw,minP)+addFixed+ (Number(inp.travel)||0);
 const consult=Math.max(raw,minP)+addFixed;
 const totalH=ROLES.reduce((s,r)=>s+H[r],0)*buf;
 const days=totalH/S.hpd;
 // partner
 let pfee=0; const P=inp.partner;
 if(P==="A") pfee=consult*S.partner.aPct/100; else if(P==="B") pfee=S.partner.bFixed; else pfee=0;
 const vatRate=lk(S.legal,inp.legal,"vat")||0;
 const weeks = pkg==="workshop"?[1,2]:pkg==="express"?[2,3]:pkg==="discovery"?[3,6]:[6,10];
 return {pkg,lines,H,addons,cost,mult,M,margin,raw,minP,minApplied:raw<minP,addFixed,price,consult,pfee,net:price-pfee-(Number(inp.travel)||0),totalH,days,buf,vatRate,weeks};
}

${x.vatRate>0?"• Prices exclude VAT ("+x.vatRate+"%).":""}

Happy to discuss the details.

Dariia Danovska | AI Strategist, Velway AI Solutions`;
}
function pProposal(R){
 const c=t().proposal;
 return h(`<div class="page on">${head(c.title,c.sub)}
 <section class="card"><div class="row" style="margin-bottom:10px"><label>${c.lang}</label><div class="seg" style="background:var(--teal-soft)"><button data-pl="uk" class="${ui.proposalLang==="uk"?"on":""}" style="color:var(--ink)">UA</button><button data-pl="en" class="${ui.proposalLang==="en"?"on":""}" style="color:var(--ink)">EN</button></div>
 <button class="btn" id="btnCopy">${c.copy}</button><span class="sm" id="copyMsg"></span></div>
 <textarea id="proposalText" style="min-height:520px">${esc(proposalText(R))}</textarea></section></div>`);
}
function pSettings(){
 const c=t().settings;
 const rates=ROLES.map(k=>`<tr><td>${c.roles[k]}</td><td class="n">${inpN("S.rates."+k,S.rates[k],"5")}</td></tr>`).join("");
 const pk=["workshop","express","discovery","premium"];
 const margins=pk.map(p=>`<tr><td>${t().scope.pkgs[p]}</td><td class="n">${inpN("S.margin."+p,S.margin[p],"5")}</td><td class="n">${inpN("S.minPrice."+p,S.minPrice[p],"100")}</td></tr>`).join("");
 const norms=`<tr><td>${ui.lang==="uk"?"Стратегічна сесія (BA)":"Strategic session (BA)"}</td><td class="n">${inpN("S.norm.session",S.norm.session,"0.5")}</td></tr><tr><td>${ui.lang==="uk"?"Аналіз після сесії (BA)":"Post-session analysis (BA)"}</td><td class="n">${inpN("S.norm.analysis",S.norm.analysis,"0.5")}</td></tr>`+ROLES.map(k=>`<tr><td>${c.roles[k]}</td><td class="n">${inpN("S.norm."+k,S.norm[k],"0.5")}</td></tr>`).join("");
 const fixedRows=pk.map(p=>Object.keys(S.fixed[p]).map(id=>`<tr><td>${t().scope.pkgs[p]}</td><td>${t().result.linesL[id]}</td>${ROLES.map(k=>`<td class="n">${inpN(`S.fixed.${p}.${id}.${k}`,S.fixed[p][id][k],"0.5")}</td>`).join("")}</tr>`).join("")).join("");
 const perRows=[["facilDay",ui.lang==="uk"?"Фасилітація воркшопу, за день":"Workshop facilitation, per day"],["interview",ui.lang==="uk"?"Додаткове інтерв'ю, за одне":"Extra interview, each"],["usecase",ui.lang==="uk"?"Use case понад базу, за один":"Use case above base, each"]].map(([id,l])=>`<tr><td colspan="2">${l}</td>${ROLES.map(k=>`<td class="n">${inpN(`S.${id}.${k}`,S[id][k],"0.25")}</td>`).join("")}</tr>`).join("");
 const addons=S.addons.map((a,i)=>`<tr><td><input type="text" data-path="S.addons.${i}.${ui.lang}" value="${esc(a[ui.lang])}"></td>${ROLES.map(k=>`<td class="n">${inpN(`S.addons.${i}.h.${k}`,a.h[k],"0.5")}</td>`).join("")}<td class="n">${inpN(`S.addons.${i}.fixed`,a.fixed,"100")}</td><td class="n"><label class="sm"><input type="checkbox" data-inclprem="${i}" ${a.incl.includes("premium")?"checked":""}> Premium</label></td></tr>`).join("");
 const mtab=(key,title)=>card(title,`<div class="tbl-wrap"><table><thead><tr><th>${c.label}</th><th class="n">${c.mult}</th></tr></thead><tbody>${S[key].map((o,i)=>`<tr><td><input type="text" data-path="S.${key}.${i}.k" value="${esc(o.k)}"></td><td class="n">${inpN(`S.${key}.${i}.m`,o.m,"0.05")}</td></tr>`).join("")}</tbody></table></div>`);
 return h(`<div class="page on">${head(c.title,c.sub)}
 ${card(c.rates,`<div class="grid"><div><table><tbody>${rates}</tbody></table></div><div>${field(c.hpd,inpN("S.hpd",S.hpd,"1"))}<br>${field(c.buffer,inpN("S.buffer",S.buffer,"1"))}<br>${field(c.wfactor,inpN("S.wfFactor",S.wfFactor,"0.05"))}</div></div>`)}
 ${card(c.margins,`<div class="tbl-wrap"><table><thead><tr><th></th><th class="n">${c.margins}</th><th class="n">${c.mins}</th></tr></thead><tbody>${margins}</tbody></table></div>`)}
 ${card(c.norms,`<table><tbody>${norms}</tbody></table>`,c.normsub)}
 ${card(c.fixed,`<div class="tbl-wrap"><table><thead><tr><th></th><th></th><th class="n">BA</th><th class="n">PM</th><th class="n">TL</th><th class="n">Arch</th></tr></thead><tbody>${fixedRows}${perRows}</tbody></table></div>`)}
 ${card(c.addons,`<div class="tbl-wrap"><table><thead><tr><th>${c.addon}</th><th class="n">BA</th><th class="n">PM</th><th class="n">TL</th><th class="n">Arch</th><th class="n">${c.fixedPrice}</th><th></th></tr></thead><tbody>${addons}</tbody></table></div>`)}
 ${mtab("country",c.country)}${mtab("vertical",c.vertical)}${mtab("size",c.size)}${mtab("urgency",c.urgency)}${mtab("maturity",c.maturity)}
 ${card(c.partner,`<div class="grid">${field(c.pA,inpN("S.partner.aPct",S.partner.aPct,"1"))}${field(c.pB_fixed,inpN("S.partner.bFixed",S.partner.bFixed,"100"))}${field(c.pB_pct,inpN("S.partner.bPct",S.partner.bPct,"0.5"))}</div><p class="sm">${c.pC}</p>`)}
 ${card(c.legal,`<div class="tbl-wrap"><table><thead><tr><th>${c.label}</th><th class="n">${c.vatRate}</th></tr></thead><tbody>${S.legal.map((o,i)=>`<tr><td><input type="text" data-path="S.legal.${i}.k" value="${esc(o.k)}"></td><td class="n">${inpN(`S.legal.${i}.vat`,o.vat,"1")}</td></tr>`).join("")}</tbody></table></div>`)}
 ${card(c.fx,`<div class="tbl-wrap"><table><tbody>${S.fx.map((o,i)=>`<tr><td>${o.k}</td><td class="n">${inpN(`S.fx.${i}.r`,o.r,"0.01")}</td></tr>`).join("")}</tbody></table></div>`)}
 <div class="row"><button class="btn ghost" id="btnReset">${c.reset}</button></div>
 </div>`);
}

/* ===================== events ===================== */
function setPath(path,val){const parts=path.split("."); let o=parts[0]==="S"?S:I; for(let i=1;i<parts.length-1;i++) o=o[parts[i]]; o[parts[parts.length-1]]=val;}
function bind(root){
 root.querySelectorAll("[data-i]").forEach(el=>el.addEventListener("change",e=>{const v=el.type==="number"?Number(el.value):el.value; I[el.dataset.i]=v; render();}));
 root.querySelectorAll("[data-path]").forEach(el=>el.addEventListener("change",()=>{setPath(el.dataset.path,el.type==="number"?Number(el.value):el.value); render();}));
 root.querySelectorAll("[data-pkg]").forEach(el=>el.addEventListener("click",()=>{I.pkg=el.dataset.pkg; render();}));
 root.querySelectorAll("[data-addon]").forEach(el=>el.addEventListener("change",()=>{I.addons[el.dataset.addon]=el.checked; render();}));
 root.querySelectorAll("[data-risk]").forEach(el=>el.addEventListener("change",()=>{I.risks[el.dataset.risk]=el.checked; render();}));
 root.querySelectorAll("[data-inclprem]").forEach(el=>el.addEventListener("change",()=>{const a=S.addons[+el.dataset.inclprem]; a.incl=el.checked?["premium"]:[]; render();}));
 root.querySelectorAll("[data-prj]").forEach(el=>el.addEventListener("change",()=>{const p=I.projects[+el.dataset.prj]; p[el.dataset.f]=el.type==="number"?Number(el.value):el.value; render();}));
 root.querySelectorAll("[data-delprj]").forEach(el=>el.addEventListener("click",()=>{I.projects.splice(+el.dataset.delprj,1); render();}));
 root.querySelectorAll("[data-pl]").forEach(el=>el.addEventListener("click",()=>{ui.proposalLang=el.dataset.pl; render();}));
 const add=$("#btnAddPrj",root); if(add) add.onclick=()=>{I.projects.push({name:I.company||("Project "+(I.projects.length+1)),pkg:I.pkg,weeks:calcAll()[I.pkg].weeks[1],inp:{unit:I.unit,nDept:I.nDept,nWf:I.nWf,interviews:I.interviews,roadmap:I.roadmap,usecases:I.usecases,wdays:I.wdays,addons:Object.assign({},I.addons),country:I.country,vertical:I.vertical,size:I.size,urgency:I.urgency,maturity:I.maturity,partner:I.partner,legal:I.legal}}); render();};
 const cp=$("#btnCopy",root); if(cp) cp.onclick=async()=>{const ta=$("#proposalText"); try{await navigator.clipboard.writeText(ta.value);}catch(e){ta.select();document.execCommand("copy");} $("#copyMsg").textContent=t().proposal.copied;};
 const rs=$("#btnReset",root); if(rs) rs.onclick=()=>{if(confirm(t().settings.resetQ)){S=DEF_SETTINGS(); render();}};
 const ex=$("#btnExport",root); if(ex) ex.onclick=exportCSV;
 const tg=$("#inTarget",root); if(tg) tg.onchange=()=>{ui.target=Number(tg.value); render();};
 const cn=$("#inCalibN",root); if(cn) cn.onchange=()=>{ui.calibN=Number(cn.value); render();};
 const ap=$("#btnApplyNorm",root); if(ap) ap.onclick=()=>{const k=Number(ap.dataset.k); for(const key of ["session","analysis","ba","pm","tl","arch"]) S.norm[key]=Math.round(S.norm[key]*k*4)/4; if(I.unit==="dept") I.nDept=Math.max(1,Number(ui.calibN)||6); else I.nWf=Math.max(1,Number(ui.calibN)||6); render(); const m=$("#applyMsg"); if(m) m.textContent=t().result.applied;};
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-p]"); if(b){ui.page=b.dataset.p; render(); window.scrollTo(0,0);}});
function csvOf(R){
 const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
 const rows=[["Client",I.company],["Country",I.country],["Vertical",I.vertical],["Size",I.size],["Urgency",I.urgency],["Maturity",I.maturity],["Currency",I.cur],["Partner option",I.partner],["Payment terms",I.pay],[]];
 rows.push(["Package","Hours","Days","Cost EUR","Client price EUR","Client price ("+I.cur+")","Partner fee EUR","Net EUR","Weeks"]);
 for(const p of ["workshop","express","discovery","premium"]){const x=R[p]; const r=lk(S.fx,I.cur,"r")||1; rows.push([p,x.totalH.toFixed(1),x.days.toFixed(1),x.cost.toFixed(0),x.price.toFixed(0),(x.price*r).toFixed(0),x.pfee.toFixed(0),x.net.toFixed(0),x.weeks.join("-")]);}
 rows.push([]); rows.push(["Selected: "+I.pkg]); rows.push(["Line","BA","PM","TL","Arch"]);
 const x=R[I.pkg]; for(const l of x.lines) rows.push([t().result.linesL[l.id],...ROLES.map(k=>l.h[k])]);
 for(const a of x.addons) rows.push([a.a.en,...(a.h?ROLES.map(k=>a.h[k]):["fixed",a.fixed])]);
 if(ui.mode==="partner"){ // strip cost columns
  return rows.map(r=>r.length===9&&r[0]!=="Package"&&["workshop","express","discovery","premium"].includes(r[0])?[r[0],r[1],r[2],"",r[4],r[5],"","",r[8]]:r.length===9?[r[0],r[1],r[2],"",r[4],r[5],"","",r[8]]:r).map(r=>r.map(q).join(",")).join("\n");
 }
 return rows.map(r=>r.map(q).join(",")).join("\n");
}
async function exportCSV(){
 const msg=$("#exportMsg"); const R=calcAll(); const csv="\ufeff"+csvOf(R);
 const name=`velway-discovery-${(I.company||"estimate").replace(/[^\w\-]+/g,"_")}.csv`;
 try{
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
  if(dl){ await dl.save({filename:name,data:csv}); msg.textContent="✓"; return; }
 }catch(e){ if(e&&e.code==="declined"){msg.textContent="";return;} }
 try{ await navigator.clipboard.writeText(csv); msg.textContent=(ui.lang==="uk"?"Експорт недоступний тут — CSV скопійовано у буфер":"Export unavailable here — CSV copied to clipboard"); }
 catch(e){ msg.textContent=t().result.exportNo; }
}
$("#modeSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ui.mode=b.dataset.m; render();});
$("#langSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ui.lang=b.dataset.l; ui.proposalLang=b.dataset.l; render();});
load(); render();
</script>
